<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoodleBuds | Canvas</title>
    <link rel="stylesheet" href="canvas.css">
</head>
<body>
    <h1>---DRAW---</h1>
    <h1 class="roomCode"></h1>
    <h1 class="roomCreator"></h1>
    <canvas class="canvas">
    </canvas>
    <canvas class="cursor-layer"></canvas>

    <div class="tool-control">
        <button class="toolbtn">Tool: <span class="current-tool">Pen</span></button>
        <div class="tool-popup">
            <button class="popup-item" data-tool="pen">Pen</button>
            <button class="popup-item" data-tool="neon">Neon</button>
            <button class="popup-item" data-tool="eraser">Eraser</button>
        </div>
    </div>

    <div class="shape-control">
        <button class="shapebtn">Shape: <span class="current-shape">Freehand</span></button>
        <div class="shape-popup">
            <button class="popup-item" data-shape="freehand">Freehand</button>
            <button class="popup-item" data-shape="line">Line</button>
            <button class="popup-item" data-shape="rectangle">Rectangle</button>
            <button class="popup-item" data-shape="circle">Circle</button>
        </div>
    </div>

    <button class="clrbtn">CLEAR</button>
    <button class="undobtn">UNDO</button>
    <button class="redobtn">REDO</button>
    <label for="color-picker" class="colrlbl">Choose A Color =></label>
    <input type="color" class="colrbtn" name="color-picker" value="#000000">
    <label for="sizer" class="sldlbl">Size</label>
    <input type="range" name="sizer" class="sizer" min="1" max="10" step="1">
    <div class="footer">
            <p class="footer-text">Developed by Hassan Nawaz. ©2026 DoodleBuds. All rights reserved. </p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket = null;
        let user;
        let room;
        fetch('/session-user', {
            method: 'GET',
            headers: {
                'Content-Type' : 'application/json'
            }
        }).then(res=>res.json())
        .then(data=>{
            user = data.user;
        })

        fetch('/session-room')
        .then(res => res.json())
        .then(data => {
            if (!data.success) return;
            
            socket = io();

            socket.on("room-state", ({ strokes, history }) => {
                for (const owner in strokes) {
                    ensureUser(owner);
                    userStrokes[owner] = strokes[owner];
                }
                for (const owner in history) {
                    ensureUser(owner);
                    userHistory[owner] = history[owner];
                }
                isStrokesDirty = true;
                requestRedraw();
            });

            socket.on("remote-live-segment", (data) => {
                ensureUser(data.owner);
                if (!activeStrokes[data.owner]) {
                    activeStrokes[data.owner] = {
                        owner: data.owner,
                        ownerName: data.ownerName,
                        tool: data.tool,
                        shape: data.shape || "freehand",
                        color: data.color,
                        size: data.size,
                        seq: data.seq,
                        points: []
                    };
                    isStrokesDirty = true;
                }
                activeStrokes[data.owner].points.push(data.point);

                drawSegmentDirect(activeStrokes[data.owner], data.point);

                const p = data.point;
                updateCursorLabel(data.owner, data.ownerName, p.x2, p.y2);
                refreshCursorLabels();
            });

            socket.on("remote-stroke", (stroke) => {

                ensureUser(stroke.owner);

                delete activeStrokes[stroke.owner];

                removeCursorLabel(stroke.owner);

                if (stroke.points && stroke.points.length > 0) {
                    userStrokes[stroke.owner].push(stroke);
                    userHistory[stroke.owner] = [];
                }

                isStrokesDirty = true;
                requestRedraw();

            });

            socket.on("remote-live-stroke", (data) => {

                activeStrokes[data.owner] = data;
                isStrokesDirty = true;
                requestRedraw();

                if (data.points && data.points.length > 0) {
                    const last = data.points[data.points.length - 1];
                    updateCursorLabel(data.owner, data.ownerName, last.x2, last.y2);
                }

            });

            socket.on("remote-user-undo", ({ owner }) => {

                ensureUser(owner);

                if (userStrokes[owner].length === 0) return;

                const last = userStrokes[owner].pop();

                userHistory[owner].push(last);

                isStrokesDirty = true;
                requestRedraw();

            });

            socket.on("remote-user-redo", ({ owner }) => {

                ensureUser(owner);

                if (userHistory[owner].length === 0) return;

                const next = userHistory[owner].pop();

                userStrokes[owner].push(next);

                isStrokesDirty = true;
                requestRedraw();

            });

            socket.on("remote-clear-canvas", () => {
                resetLocalState();
            });

            // Fires on the initial connection AND every automatic reconnect
            // (dropped wifi, laptop sleep, etc). Re-joining is safe to repeat --
            // the server always answers with a fresh room-state, so this is
            // what keeps the canvas in sync after a connectivity blip without
            // needing a manual page refresh. Listeners are registered above,
            // outside this handler, so reconnecting never double-registers them.
            socket.on("connect", () => {

                console.log("Connected to server with socket ID:", socket.id);

                socket.emit("join-room", {
                    roomCode: data.room.code,
                    userId: user.id
                });

            });

            document.querySelector('.roomCode').textContent =
                "Room Code: " + data.room.code;
    
            document.querySelector('.roomCreator').textContent =
                "Room Creator: " + data.room.creator.username;
            
            room = data.room;
        });
        

        const canvas = document.querySelector('.canvas');
        const ctx = canvas.getContext("2d");
        const sld = document.querySelector(".sizer");

        // Dedicated overlay canvas for remote cursor labels. Keeping labels on
        // their own transparent layer lets us refresh them cheaply (just this
        // small overlay) without doing a full redraw of the main drawing
        // canvas on every incoming live freehand segment.
        const cursorCanvas = document.querySelector('.cursor-layer');
        const cursorCtx = cursorCanvas.getContext("2d");

        function syncCursorCanvasSize() {
            const r = canvas.getBoundingClientRect();
            cursorCanvas.style.position = 'fixed';
            cursorCanvas.style.left = r.left + 'px';
            cursorCanvas.style.top = r.top + 'px';
            cursorCanvas.style.width = r.width + 'px';
            cursorCanvas.style.height = r.height + 'px';
            cursorCanvas.style.pointerEvents = 'none';
            cursorCanvas.style.zIndex = 10;
            cursorCanvas.width = canvas.width;
            cursorCanvas.height = canvas.height;
        }


        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        syncCursorCanvasSize();

        window.addEventListener('resize', function() {
            const r = canvas.getBoundingClientRect();
            canvas.width = r.width;
            canvas.height = r.height;
            syncCursorCanvasSize();
            requestRedraw();
        });


        const ERASER_MULTIPLIER = 4;

        let isdrawing = false;
        let prex = 0;
        let prey = 0;
        let userStrokes = {};   
        let activeStrokes = {};
        let userHistory = [];   
        let stroke = null;
        let currentTool = "pen";
        let currentShape = "freehand";
        let startx,starty = 0;
        const dotsize = 0.001;
        let cursorLabels = {};
        let lastShapeFrame = 0;

        let cachedAllStrokes = [];
        let isStrokesDirty = true;
        let redrawPending = false;

        function requestRedraw() {
            if (!redrawPending) {
                redrawPending = true;
                requestAnimationFrame(executeRedraw);
            }
        }

        function executeRedraw() {
            redrawPending = false;
            redraw();
        }

        const btn = document.querySelector('.clrbtn');
        btn.addEventListener('pointerdown', function() {
            btn.classList.add('btnclicked');
            clearCanvas();
        })
        btn.addEventListener('pointerup', function() {
            btn.classList.remove('btnclicked');
        })

        const btn2 = document.querySelector('.undobtn');
        btn2.addEventListener('pointerdown', function() {
            btn2.classList.add('btnclicked');
            undo();
        })
        btn2.addEventListener('pointerup', function() {
            btn2.classList.remove('btnclicked');
        })

        const btn3 = document.querySelector('.redobtn');
        btn3.addEventListener('pointerdown', function() {
            btn3.classList.add('btnclicked');
            redo();
        })
        btn3.addEventListener('pointerup', function() {
            btn3.classList.remove('btnclicked');
        })


        const toolbtn = document.querySelector('.toolbtn');
        const toolPopup = document.querySelector('.tool-popup');
        const shapebtn = document.querySelector('.shapebtn');
        const shapePopup = document.querySelector('.shape-popup');
        const currentToolLabel = document.querySelector('.current-tool');
        const currentShapeLabel = document.querySelector('.current-shape');

        toolbtn.addEventListener('pointerdown', function(e) {
            e.stopPropagation();
            shapePopup.classList.remove('open');
            toolPopup.classList.toggle('open');
        })

        shapebtn.addEventListener('pointerdown', function(e) {
            e.stopPropagation();
            toolPopup.classList.remove('open');
            shapePopup.classList.toggle('open');
        })

        toolPopup.querySelectorAll('.popup-item').forEach(function(item) {
            item.addEventListener('pointerdown', function(e) {
                e.stopPropagation();
                selectTool(item.dataset.tool);
                toolPopup.classList.remove('open');
            })
        })

        shapePopup.querySelectorAll('.popup-item').forEach(function(item) {
            item.addEventListener('pointerdown', function(e) {
                e.stopPropagation();
                selectShape(item.dataset.shape);
                shapePopup.classList.remove('open');
            })
        })

        document.addEventListener('pointerdown', function() {
            toolPopup.classList.remove('open');
            shapePopup.classList.remove('open');
        })

        function ensureUser(owner){

            if(!userStrokes[owner]){
                userStrokes[owner] = [];
            }
        
            if(!userHistory[owner]){
                userHistory[owner] = [];
            }
        
        }

        function selectTool(tool) {
            currentTool = tool;
            currentToolLabel.textContent = tool.charAt(0).toUpperCase() + tool.slice(1);
        }

        function selectShape(shape) {
            currentShape = shape;
            currentShapeLabel.textContent = shape.charAt(0).toUpperCase() + shape.slice(1);
        }

        function getEffectiveShape() {
            if (currentTool === "eraser") return "freehand";
            return currentShape;
        }

        function start(e) {
            startx = e.offsetX;
            starty = e.offsetY;
            if (isdrawing) return;

            const clr = document.querySelector(".colrbtn").value;
            const size = document.querySelector(".sizer").value;

            canvas.setPointerCapture(e.pointerId);

            const effShape = getEffectiveShape();

            if (currentTool === "eraser") {
                stroke = {
                    owner: user.id,
                    ownerName: user.username,
                    tool: "eraser",
                    shape: effShape,
                    color: "white",
                    size: size,
                    points: []
                };
            } 
            else if(currentTool === "neon"){
                stroke = {
                    owner: user.id,
                    ownerName: user.username,
                    tool: "neon",
                    shape: effShape,
                    color: clr,
                    size: size,
                    points: []
                };
            } 
            else {
                stroke = {
                    owner: user.id,
                    ownerName: user.username,
                    tool: "pen",
                    shape: effShape,
                    color: clr,
                    size: size,
                    points: []
                };
            }

            // Give it a provisional seq immediately -- without this,
            // buildSortedStrokes() treats it as seq 0 and sorts the live
            // preview underneath every already-finished stroke until the
            // server's authoritative seq arrives when the stroke finishes.
            stroke.seq = Date.now();

            activeStrokes[user.id] = stroke;
            isStrokesDirty = true;

            isdrawing = true;
            prex = e.offsetX;
            prey = e.offsetY;
            drawline(prex, prey, prex+dotsize, prey+dotsize);
        }

        function draw(e) {
            if (!isdrawing) return;
            e.preventDefault();

            const shape = getEffectiveShape();

            if(shape === "rectangle"){
                drawrect(startx, starty, e.offsetX, e.offsetY);
                return;
            }
            else if(shape === "circle"){
                drawcircle(startx, starty, e.offsetX, e.offsetY);
                return;
            }
            else if(shape === "line"){
                drawshapedline(startx, starty, e.offsetX, e.offsetY);
                return;
            }

            const currx = e.offsetX;
            const curry = e.offsetY;
            const dx = currx - prex;
            const dy = curry - prey;

            if (dx * dx + dy * dy >= 1) {
                drawline(prex, prey, currx, curry);
                prex = currx;
                prey = curry;
            }
        }

        function broadcastLiveStroke() {
            if (socket) {
                socket.emit("live-stroke", stroke);
            }
        }

        function drawline(x1, y1, x2, y2) {
            const nx1 = x1 / canvas.width;
            const ny1 = y1 / canvas.height;
            const nx2 = x2 / canvas.width;
            const ny2 = y2 / canvas.height;
            const segment = { x1: nx1, y1: ny1, x2: nx2, y2: ny2 };
            stroke.points.push(segment);

            drawSegmentDirect(stroke, segment);

            if (socket) {
                socket.emit("live-segment", {
                    owner: stroke.owner,
                    ownerName: stroke.ownerName,
                    tool: stroke.tool,
                    shape: stroke.shape,
                    color: stroke.color,
                    size: stroke.size,
                    seq: stroke.seq,
                    point: segment
                });
            }
        }

        function drawrect(x1,y1,x2,y2){
            stroke.points = [
                { x1: x1/canvas.width, y1: y1/canvas.height, x2: x2/canvas.width, y2: y1/canvas.height },
                { x1: x2/canvas.width, y1: y1/canvas.height, x2: x2/canvas.width, y2: y2/canvas.height },
                { x1: x2/canvas.width, y1: y2/canvas.height, x2: x1/canvas.width, y2: y2/canvas.height },
                { x1: x1/canvas.width, y1: y2/canvas.height, x2: x1/canvas.width, y2: y1/canvas.height }
            ];

            const now = Date.now();
            if (now - lastShapeFrame < 16) return;
            lastShapeFrame = now;

            requestRedraw();

            broadcastLiveStroke();
        }

        function drawcircle(x1,y1,x2,y2){

            const cx = (x1 + x2) / 2;
            const cy = (y1 + y2) / 2;

            const radius = Math.sqrt(
                (x2-x1)*(x2-x1) +
                (y2-y1)*(y2-y1)
            ) / 2;

            stroke.points = [];
            const pieces = 72;
            for(let i=0;i<pieces;i++){
                const a1 = (i/pieces) * Math.PI*2;
                const a2 = ((i+1)/pieces) * Math.PI*2;
                stroke.points.push({
                    x1: (cx + radius*Math.cos(a1)) / canvas.width,
                    y1: (cy + radius*Math.sin(a1)) / canvas.height,
                    x2: (cx + radius*Math.cos(a2)) / canvas.width,
                    y2: (cy + radius*Math.sin(a2)) / canvas.height
                });
            }

            const now = Date.now();
            if (now - lastShapeFrame < 16) return;
            lastShapeFrame = now;

            requestRedraw();

            broadcastLiveStroke();
        }

        function drawshapedline(x1,y1,x2,y2){
            stroke.points = [{
                x1: x1/canvas.width,
                y1: y1/canvas.height,
                x2: x2/canvas.width,
                y2: y2/canvas.height
            }];

            const now = Date.now();
            if (now - lastShapeFrame < 16) return;
            lastShapeFrame = now;

            requestRedraw();

            broadcastLiveStroke();
        }

        function saveStroke() {

            if (!stroke || stroke.points.length === 0) return;

            ensureUser(user.id);

            delete activeStrokes[user.id];

            removeCursorLabel(user.id);

            userHistory[user.id] = [];

            if (socket) {
                socket.emit("stroke-finished", stroke);
            }

            stroke = null;

            isStrokesDirty = true;

        }

        function end(e) {
            if (!isdrawing) return;

            if (e && e.pointerId !== undefined) {
                try {
                    canvas.releasePointerCapture(e.pointerId);
                } catch (err) {}
            }

            isdrawing = false;

            saveStroke();
        }

        function applyStrokeStyle(s) {
            ctx.lineWidth = s.size;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            if (s.tool === "eraser") {
                ctx.globalCompositeOperation = "destination-out";
                ctx.lineWidth = s.size * ERASER_MULTIPLIER;
                ctx.strokeStyle = "white";
                ctx.shadowBlur = 0;
            } else if (s.tool === "neon") {
                ctx.globalCompositeOperation = "source-over";
                ctx.strokeStyle = "white";
                ctx.shadowColor = s.color;
                ctx.shadowBlur = 17;
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.strokeStyle = s.color;
                ctx.shadowBlur = 0;
            }
        }

        function drawStrokeSegments(s) {
            if (!s.points || s.points.length === 0) return;

            applyStrokeStyle(s);

            for (let i = 0; i < s.points.length; i++) {
                const p = s.points[i];
                ctx.beginPath();
                ctx.moveTo(p.x1 * canvas.width, p.y1 * canvas.height);
                ctx.lineTo(p.x2 * canvas.width, p.y2 * canvas.height);
                ctx.stroke();
            }

            ctx.shadowBlur = 0;
        }

        // Draws a single freehand segment directly onto the canvas, without
        // touching any other pixels. Used for local and remote live-segment
        // drawing so we never have to clear/redraw the whole canvas mid-stroke.
        function drawSegmentDirect(s, p) {
            applyStrokeStyle(s);

            ctx.beginPath();
            ctx.moveTo(p.x1 * canvas.width, p.y1 * canvas.height);
            ctx.lineTo(p.x2 * canvas.width, p.y2 * canvas.height);
            ctx.stroke();

            ctx.shadowBlur = 0;
        }

        // Cheaply refreshes just the cursor-label overlay (clears the small
        // transparent overlay canvas and redraws current labels), so remote
        // cursor labels stay correct without a full-canvas redraw.
        function refreshCursorLabels() {
            cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
            drawCursorLabels();
        }

        function buildSortedStrokes() {
            let list = [];

            for (const owner in userStrokes) {
                const arr = userStrokes[owner];
                for (let i = 0; i < arr.length; i++) {
                    list.push(arr[i]);
                }
            }

            for (const owner in activeStrokes) {
                if (activeStrokes[owner] && activeStrokes[owner].points.length > 0) {
                    list.push(activeStrokes[owner]);
                }
            }

            list.sort((a, b) => (a.seq || 0) - (b.seq || 0));

            return list;
        }

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isStrokesDirty) {
                cachedAllStrokes = buildSortedStrokes();
                isStrokesDirty = false;
            }

            for (let i = 0; i < cachedAllStrokes.length; i++) {
                drawStrokeSegments(cachedAllStrokes[i]);
            }

            refreshCursorLabels();
        }

        function updateCursorLabel(ownerId, name, normX, normY) {
            if (ownerId == user.id) return;

            cursorLabels[ownerId] = {
                name: name || "User " + ownerId,
                x: normX * canvas.width,
                y: normY * canvas.height
            };
        }

        function removeCursorLabel(ownerId) {
            delete cursorLabels[ownerId];
        }

        function drawCursorLabels() {
            cursorCtx.save();
            cursorCtx.font = "12px sans-serif";
            cursorCtx.textAlign = "left";
            cursorCtx.textBaseline = "bottom";

            for (const ownerId in cursorLabels) {
                const lbl = cursorLabels[ownerId];

                const padding = 4;
                const textWidth = cursorCtx.measureText(lbl.name).width;
                const bgWidth = textWidth + padding * 2;
                const bgHeight = 18;

                cursorCtx.fillStyle = "rgba(0, 0, 0, 0.7)";
                cursorCtx.beginPath();
                cursorCtx.roundRect(lbl.x, lbl.y - bgHeight, bgWidth, bgHeight, 4);
                cursorCtx.fill();

                cursorCtx.fillStyle = "#ffffff";
                cursorCtx.fillText(lbl.name, lbl.x + padding, lbl.y - 3);
            }

            cursorCtx.restore();
        }

        function undo() {
            ensureUser(user.id);

            if (userStrokes[user.id].length === 0) return;

            const last = userStrokes[user.id].pop();

            userHistory[user.id].push(last);

            isStrokesDirty = true;
            requestRedraw();

            if (socket) {
                socket.emit("user-undo", { owner: user.id });
            }
        }

        function redo() {
            ensureUser(user.id);

            if (userHistory[user.id].length === 0) return;

            const next = userHistory[user.id].pop();

            userStrokes[user.id].push(next);

            isStrokesDirty = true;
            requestRedraw();

            if (socket) {
                socket.emit("user-redo", { owner: user.id });
            }
        }

        function resetLocalState() {
            userStrokes = {};
            activeStrokes = {};
            userHistory = {};
            cursorLabels = {};
            ensureUser(user.id);
            isStrokesDirty = true;
            requestRedraw();
        }

        function clearCanvas() {
            resetLocalState();

            if (socket) {
                socket.emit("clear-canvas");
            }
        }

        canvas.addEventListener("pointerdown", start);
        canvas.addEventListener("pointermove", draw);
        canvas.addEventListener("pointerup", end);
        canvas.addEventListener("pointercancel", end);

    </script>
</body>
</html>
